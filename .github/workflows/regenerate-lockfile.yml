name: Regenerate npm lockfile on Linux

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate:
    name: Regenerate and verify Linux npm lockfile
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Show environment
        run: |
          echo "Node version:"
          node --version

          echo "npm version:"
          npm --version

          echo "Operating system:"
          uname -a

      - name: Generate lockfile with AJV 8 peer resolution
        run: |
          set -euxo pipefail

          rm -rf node_modules
          rm -f package-lock.json

          npm install ajv@8.20.0 \
            --save-exact \
            --include=optional \
            --no-audit \
            --no-fund

          test -f package.json
          test -f package-lock.json

          echo "Generated package-lock.json with explicit AJV 8 dependency."

      - name: Inspect native dependency entries
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const lock = JSON.parse(
            fs.readFileSync("package-lock.json", "utf8")
          );

          const packages = lock.packages ?? {};

          const interesting = Object.keys(packages)
            .filter((path) =>
              path.includes("lightningcss") ||
              path.includes("@tailwindcss/oxide")
            )
            .sort();

          console.log("Resolved LightningCSS / Tailwind Oxide entries:");

          for (const path of interesting) {
            const pkg = packages[path];

            console.log(
              `${path} -> ${pkg?.version ?? "unknown"}`
            );
          }
          NODE

      - name: Validate AJV dependency graph
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const pkg = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          const lock = JSON.parse(
            fs.readFileSync("package-lock.json", "utf8")
          );

          const packages = lock.packages ?? {};
          let failed = false;

          // 1. package.json declares ajv: "8.20.0"
          const pkgAjv = pkg.dependencies?.ajv;
          if (pkgAjv !== "8.20.0") {
            console.error(`FAIL: package.json ajv = "${pkgAjv}", expected "8.20.0"`);
            failed = true;
          } else {
            console.log(`✓ package.json declares ajv: "${pkgAjv}"`);
          }

          // 2. lockfile root manifest declares the same
          const lockRoot = packages[""]?.dependencies?.ajv;
          if (lockRoot !== "8.20.0") {
            console.error(`FAIL: lockfile root ajv = "${lockRoot}", expected "8.20.0"`);
            failed = true;
          } else {
            console.log(`✓ lockfile root declares ajv: "${lockRoot}"`);
          }

          // 3. node_modules/ajv resolves to AJV 8
          const rootAjv = packages["node_modules/ajv"];
          if (!rootAjv || !rootAjv.version?.startsWith("8.")) {
            console.error(`FAIL: node_modules/ajv version = "${rootAjv?.version}", expected 8.x`);
            failed = true;
          } else {
            console.log(`✓ node_modules/ajv resolves to ${rootAjv.version}`);
          }

          // 4. Nested AJV 6 exists for ESLint
          const nestedAjv6Paths = Object.keys(packages).filter(
            (p) =>
              p !== "node_modules/ajv" &&
              p.endsWith("/ajv") &&
              packages[p]?.version?.startsWith("6.")
          );
          if (nestedAjv6Paths.length === 0) {
            console.error("FAIL: no nested AJV 6 found for ESLint");
            failed = true;
          } else {
            for (const p of nestedAjv6Paths) {
              console.log(`✓ nested AJV 6 at ${p} (${packages[p].version})`);
            }
          }

          if (failed) {
            process.exit(1);
          }

          console.log("\nAJV dependency graph is correct.");
          NODE

      - name: Verify Linux and Windows native lock entries
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const packages = JSON.parse(
            fs.readFileSync("package-lock.json", "utf8")
          ).packages ?? {};

          const oxideVariants = [
            "node_modules/@tailwindcss/oxide-linux-x64-gnu",
            "node_modules/@tailwindcss/oxide-win32-x64-msvc"
          ];

          for (const path of oxideVariants) {
            if (!packages[path]) {
              throw new Error(`Missing Tailwind native lockfile entry: ${path}`);
            }
            console.log(`OK: ${path}@${packages[path].version}`);
          }

          // npm can hoist LightningCSS and its optional native packages to
          // root node_modules, or keep another version nested under Tailwind.
          // Validate each resolved LightningCSS version, not a fixed path.
          const installations = Object.entries(packages).filter(
            ([path]) =>
              path === "node_modules/lightningcss" ||
              path.endsWith("/node_modules/lightningcss")
          );

          if (installations.length === 0) {
            throw new Error("No LightningCSS installation in lockfile");
          }

          const variants = [
            "lightningcss-linux-x64-gnu",
            "lightningcss-win32-x64-msvc"
          ];

          for (const [path, pkg] of installations) {
            for (const name of variants) {
              const matching = Object.entries(packages).filter(
                ([candidate, native]) =>
                  (candidate === `node_modules/${name}` ||
                   candidate.endsWith(`/node_modules/${name}`)) &&
                  native.version === pkg.version
              );

              if (matching.length === 0) {
                throw new Error(
                  `Missing ${name}@${pkg.version} required by ${path}`
                );
              }

              for (const [candidate] of matching) {
                console.log(`OK: ${candidate}@${pkg.version}`);
              }
            }
          }

          console.log("Linux and Windows native packages are represented for every LightningCSS version.");
          NODE

      - name: Save manifest checksums
        run: |
          sha256sum package.json package-lock.json > /tmp/npm-manifests.sha256

      - name: Clean install cycle 1
        run: |
          set -euxo pipefail

          rm -rf node_modules

          npm ci \
            --include=optional \
            --no-audit \
            --no-fund

          sha256sum --check /tmp/npm-manifests.sha256

          npm run lint
          npm run typecheck
          npm run build

      - name: Verify Linux native modules after cycle 1
        run: |
          node --input-type=module <<'NODE'
          import { createRequire } from "node:module";

          const require = createRequire(import.meta.url);

          // Check the real native bindings through Node resolution. npm may
          // hoist their packages, so their filesystem locations are not fixed.
          for (const name of ["lightningcss", "@tailwindcss/oxide"]) {
            const resolved = require.resolve(name);
            require(name);
            console.log(`Native binding loaded: ${name} -> ${resolved}`);
          }
          NODE

      - name: Clean install cycle 2
        run: |
          set -euxo pipefail

          rm -rf node_modules

          npm ci \
            --include=optional \
            --no-audit \
            --no-fund

          sha256sum --check /tmp/npm-manifests.sha256

          npm run lint
          npm run typecheck
          npm run build

      - name: Verify final lockfile unchanged
        run: |
          sha256sum --check /tmp/npm-manifests.sha256

          echo "Both manifests remained unchanged across both npm ci cycles."

      - name: Upload verified npm manifests
        uses: actions/upload-artifact@v4
        with:
          name: verified-npm-manifests
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 7
